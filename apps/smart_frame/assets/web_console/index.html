<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>智能屏控制台</title>
<style>
  :root { --bg:#121417; --card:#1e2228; --fg:#e8eaed; --dim:#9aa0a6; --accent:#4f8cff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 12px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 4px; }
  .status-line { color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #f44336; }
  .dot.on { background: #4caf50; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 14px; color: var(--dim); font-weight: 500; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; flex: 1; min-width: 80px; cursor: pointer; }
  button.secondary { background: #2c313a; color: var(--fg); }
  button:active { opacity: .8; }
  input[type=text] { background: #121417; border: 1px solid #333; border-radius: 8px; color: var(--fg); padding: 12px; font-size: 15px; width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=file] { display: none; }
  .state-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
  .state-grid dt { color: var(--dim); }
  .state-grid dd { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log { font-size: 12px; color: var(--dim); max-height: 140px; overflow-y: auto; margin-top: 4px; }
  #log div { padding: 2px 0; border-top: 1px solid #262a31; }
  .upload-label { display: block; text-align: center; background: #2c313a; border-radius: 8px; padding: 14px; font-size: 15px; cursor: pointer; border: 1px dashed #444; }
  .field { margin-bottom: 10px; }
  .field > label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .field input[type=text], .field input[type=password] { background: #121417; border: 1px solid #333; border-radius: 8px; color: var(--fg); padding: 10px; font-size: 14px; width: 100%; }
  .switch { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; cursor: pointer; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent); }
  .cfg-result { font-size: 13px; margin-top: 8px; min-height: 18px; color: var(--dim); }
  .cfg-result.ok { color: #4caf50; }
  .cfg-result.err { color: #f44336; }
  .search-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px; margin-top:10px; }
  .search-grid .item { cursor:pointer; }
  .search-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#121417; }
  .search-grid .cap { font-size:11px; color:var(--dim); text-align:center; }
  .identity-note { color:var(--dim); font-size:12px; line-height:1.5; margin-bottom:10px; }
  .identity-tabs button.active { background:var(--accent); color:#fff; }
  .identity-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:10px; }
  .identity-item { background:#171a1f; border:1px solid #2c313a; border-radius:10px; padding:10px; }
  .identity-head { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:12px; color:var(--dim); }
  .identity-photos { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:8px; }
  .identity-photos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:#121417; }
  .identity-photos .empty { grid-column:1/-1; padding:24px 4px; text-align:center; color:var(--dim); font-size:12px; }
  .identity-actions { display:flex; gap:6px; }
  .identity-actions select { min-width:0; flex:1; background:#121417; border:1px solid #333; border-radius:8px; color:var(--fg); padding:10px 8px; font-size:14px; }
  .identity-actions button { flex:0 0 auto; min-width:64px; padding:10px; font-size:14px; }
</style>
</head>
<body>
  <h1>智能屏控制台</h1>
  <div class="status-line"><span class="dot" id="dot"></span><span id="conn">未连接</span></div>

  <div class="card">
    <h2>当前状态</h2>
    <dl class="state-grid">
      <dt>照片</dt><dd id="st-photo">-</dd>
      <dt>天气</dt><dd id="st-weather">-</dd>
      <dt>语音</dt><dd id="st-voice">-</dd>
      <dt>音量</dt><dd id="st-volume">-</dd>
      <dt id="st-nas-dt" style="display:none">NAS</dt><dd id="st-nas" style="display:none">-</dd>
    </dl>
  </div>

  <div class="card">
    <h2>相册控制</h2>
    <div class="row">
      <button class="secondary" onclick="cmd('prev_photo')">上一张</button>
      <button class="secondary" onclick="cmd('next_photo')">下一张</button>
      <button class="secondary" onclick="cmd('refresh_weather')">刷新天气</button>
      <button class="secondary" onclick="cmd('show_qr')">显示二维码</button>
    </div>
  </div>

  <div class="card">
    <h2>向量搜索</h2>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="searchInput" placeholder="如：猫 / 海边 / 证件照" enterkeyhint="search">
      <button style="flex:0 0 auto" onclick="searchText()">搜索</button>
    </div>
    <div id="searchResults" class="search-grid"></div>
  </div>

  <div class="card">
    <h2>筛选播放</h2>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="filterInput" placeholder="类别/主题：猫 / 海边 / 证件照 / 风景" enterkeyhint="search">
      <button style="flex:0 0 auto" onclick="applyFilter()">筛选</button>
      <button class="secondary" style="flex:0 0 auto" onclick="clearFilter()">全部</button>
    </div>
    <div id="filterResult" class="cfg-result"></div>
  </div>

  <div class="card">
    <h2>家庭人物确认</h2>
    <div class="identity-note">只确认“爷爷、奶奶、哥哥、弟弟”等家庭身份，不保存姓名。确认后，相册故事才会使用该身份；请根据多张代表照片判断。</div>
    <div class="row identity-tabs">
      <button id="identity-tab-unconfirmed" class="secondary active" onclick="switchIdentityTab('unconfirmed')">待确认</button>
      <button id="identity-tab-confirmed" class="secondary" onclick="switchIdentityTab('confirmed')">已确认</button>
    </div>
    <div id="identity-result" class="cfg-result"></div>
    <div id="identity-grid" class="identity-grid"></div>
    <button id="identity-more" class="secondary" style="display:none;width:100%;margin-top:10px" onclick="loadPersonProfiles(true)">加载更多</button>
  </div>

  <div class="card">
    <h2>音量</h2>
    <input type="range" id="vol" min="0" max="100" value="80" onchange="cmd('set_volume', {value: this.valueAsNumber/100})">
  </div>

  <div class="card">
    <h2>语音指令（文字）</h2>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="cmdInput" placeholder="例如：今天天气怎么样" enterkeyhint="send">
      <button style="flex:0 0 auto" onclick="sendCommand()">发送</button>
    </div>
  </div>

  <div class="card">
    <h2>播报</h2>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="announceInput" placeholder="让智能屏说一句话" enterkeyhint="send">
      <button style="flex:0 0 auto" onclick="sendAnnounce()">播报</button>
    </div>
  </div>

  <div class="card">
    <h2>上传照片</h2>
    <label class="upload-label">选择照片上传
      <input type="file" id="fileInput" accept="image/*" multiple>
    </label>
  </div>

  <div class="card">
    <h2>NAS 相册设置</h2>
    <div class="field">
      <label class="switch"><input type="checkbox" id="cfg-enabled"><span>启用 NAS 相册</span></label>
    </div>
    <div class="field"><label>WebDAV 地址</label><input type="text" id="cfg-url" placeholder="http://192.168.1.22:5005"></div>
    <div class="field"><label>账号</label><input type="text" id="cfg-user"></div>
    <div class="field"><label>密码</label><input type="password" id="cfg-password" placeholder="留空则不修改"></div>
    <div class="field"><label>远程照片目录</label><input type="text" id="cfg-dir" placeholder="/photo"></div>
    <div class="field">
      <label class="switch"><input type="checkbox" id="cfg-filter"><span>过滤截图等文件</span></label>
    </div>
    <div class="field"><label>过滤关键词（逗号分隔）</label><input type="text" id="cfg-keywords" placeholder="截图, screenshot, 屏幕快照"></div>
    <div class="row">
      <button class="secondary" id="cfg-test-btn" onclick="testNas()">测试连接</button>
      <button onclick="saveNas()">保存</button>
    </div>
    <div id="cfg-result" class="cfg-result"></div>
  </div>

  <div class="card">
    <h2>家庭 Agent</h2>
    <button onclick="openParentCenter()">打开家长作业中心</button>
    <div class="cfg-result">默认连接同一主机的 8790 端口</div>
  </div>

  <div class="card">
    <h2>消息</h2>
    <div id="log"></div>
  </div>

<script>
let ws = null;
const logEl = document.getElementById('log');

function log(msg) {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  logEl.prepend(d);
}

function openParentCenter() {
  const scheme = location.protocol === 'https:' ? 'https:' : 'http:';
  window.open(scheme + '//' + location.hostname + ':8790/parent/', '_blank', 'noopener');
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => {
    document.getElementById('dot').className = 'dot on';
    document.getElementById('conn').textContent = '已连接';
    log('已连接到智能屏');
  };
  ws.onclose = () => {
    document.getElementById('dot').className = 'dot';
    document.getElementById('conn').textContent = '已断开，重连中…';
    setTimeout(connect, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'state') {
      document.getElementById('st-photo').textContent = m.photo || '-';
      document.getElementById('st-weather').textContent = m.weather || '-';
      document.getElementById('st-voice').textContent = m.voice || '-';
      document.getElementById('st-volume').textContent =
        m.volume != null ? Math.round(m.volume * 100) + '%' : '-';
      if (m.volume != null) document.getElementById('vol').value = Math.round(m.volume * 100);
      // nas 字段缺失（旧端）时该行保持隐藏，兼容性考虑
      if (m.nas != null) {
        document.getElementById('st-nas-dt').style.display = '';
        const nasDd = document.getElementById('st-nas');
        nasDd.style.display = '';
        nasDd.textContent = m.nas;
      }
    } else if (m.type === 'event') {
      log(m.message || JSON.stringify(m));
    }
  };
}

function cmd(action, args) {
  if (!ws || ws.readyState !== 1) { log('未连接'); return; }
  ws.send(JSON.stringify(Object.assign({ type: 'command', action: action }, args || {})));
}

function sendCommand() {
  const el = document.getElementById('cmdInput');
  const t = el.value.trim();
  if (!t) return;
  cmd('text_command', { text: t });
  el.value = '';
}

function sendAnnounce() {
  const el = document.getElementById('announceInput');
  const t = el.value.trim();
  if (!t) return;
  cmd('announce', { text: t });
  el.value = '';
}

document.getElementById('cmdInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendCommand(); });
document.getElementById('announceInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendAnnounce(); });

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files.length) return;
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f, f.name);
    log('上传中: ' + f.name);
    try {
      const r = await fetch('/api/photos', { method: 'POST', body: fd });
      log(r.ok ? '已上传: ' + f.name : '上传失败: ' + f.name + ' (' + r.status + ')');
    } catch (err) {
      log('上传出错: ' + f.name);
    }
  }
  e.target.value = '';
});

// ===== NAS 相册配置 =====
async function loadNasConfig() {
  try {
    const r = await fetch('/api/config');
    if (!r.ok) return;
    const c = await r.json();
    document.getElementById('cfg-enabled').checked = !!c.nasEnabled;
    document.getElementById('cfg-url').value = c.nasWebdavUrl || '';
    document.getElementById('cfg-user').value = c.nasWebdavUser || '';
    document.getElementById('cfg-dir').value = c.nasRemoteDir || '';
    document.getElementById('cfg-filter').checked = c.nasFilterEnabled !== false;
    document.getElementById('cfg-keywords').value = (c.nasFilterKeywords || []).join(', ');
    const pwdEl = document.getElementById('cfg-password');
    pwdEl.value = '';
    pwdEl.placeholder = c.hasPassword ? '已设置，留空则不修改' : '留空则不修改';
  } catch (e) {
    setCfgResult('加载配置失败', 'err');
  }
}

function nasPayload() {
  // 密码不 trim：空串=不改，非空才下发
  return {
    nasEnabled: document.getElementById('cfg-enabled').checked,
    nasWebdavUrl: document.getElementById('cfg-url').value.trim(),
    nasWebdavUser: document.getElementById('cfg-user').value.trim(),
    nasWebdavPassword: document.getElementById('cfg-password').value,
    nasRemoteDir: document.getElementById('cfg-dir').value.trim(),
    nasFilterEnabled: document.getElementById('cfg-filter').checked,
    nasFilterKeywords: document.getElementById('cfg-keywords').value
      .split(/[,，]/).map(s => s.trim()).filter(s => s.length),
  };
}

function setCfgResult(text, kind) {
  const el = document.getElementById('cfg-result');
  el.textContent = text;
  el.className = 'cfg-result ' + (kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : '');
}

async function testNas() {
  const btn = document.getElementById('cfg-test-btn');
  btn.disabled = true;
  setCfgResult('测试中…', '');
  try {
    const r = await fetch('/api/config/test', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(nasPayload()),
    });
    const c = await r.json();
    setCfgResult(c.message || (c.ok ? '连接成功' : '连接失败'), c.ok ? 'ok' : 'err');
  } catch (e) {
    setCfgResult('请求失败: ' + e, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function saveNas() {
  setCfgResult('保存中…', '');
  try {
    const r = await fetch('/api/config', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(nasPayload()),
    });
    const c = await r.json();
    if (c.ok) {
      setCfgResult('已保存，正在连接 NAS…（见顶部 NAS 状态行）', 'ok');
      const pwdEl = document.getElementById('cfg-password');
      pwdEl.value = '';
      pwdEl.placeholder = '已设置，留空则不修改';
    } else {
      setCfgResult('保存失败: ' + (c.message || ''), 'err');
    }
  } catch (e) {
    setCfgResult('请求失败: ' + e, 'err');
  }
}

connect();
loadNasConfig();

// ===== 向量搜索（文本 CLIP + 图相似 dinov2）=====
async function searchText() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const grid = document.getElementById('searchResults');
  grid.innerHTML = '<div style="color:var(--dim)">搜索中…</div>';
  try {
    const r = await fetch('/api/search/text?q=' + encodeURIComponent(q) + '&n=24');
    const d = await r.json();
    renderResults(d.results || []);
  } catch (e) {
    grid.innerHTML = '<div style="color:#f44336">搜索失败（搜索服务未启动？）</div>';
  }
}

async function searchSimilar(idEnc) {
  const grid = document.getElementById('searchResults');
  grid.innerHTML = '<div style="color:var(--dim)">找相似…</div>';
  const r = await fetch('/api/search/similar?id=' + idEnc + '&n=24');
  const d = await r.json();
  renderResults(d.results || []);
}

function renderResults(results) {
  const grid = document.getElementById('searchResults');
  if (!results.length) { grid.innerHTML = '<div style="color:var(--dim)">无结果</div>'; return; }
  grid.innerHTML = results.map(r => {
    const idEnc = encodeURIComponent(r.id);
    return '<div class="item" onclick="searchSimilar(\'' + idEnc + '\')">' +
      '<img src="/api/photos/file?id=' + idEnc + '" loading="lazy">' +
      '<div class="cap">' + r.score + '</div></div>';
  }).join('');
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchText(); });

// ===== 筛选播放（输入框 → app 轮播只播匹配的）=====
async function applyFilter() {
  const q = document.getElementById('filterInput').value.trim();
  if (!q) return;
  const el = document.getElementById('filterResult');
  el.className = 'cfg-result'; el.textContent = '筛选中…';
  try {
    const r = await fetch('/api/filter', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({q}),
    });
    const d = await r.json();
    if (d.ok) {
      el.className = 'cfg-result ok';
      el.textContent = d.count > 0
        ? `筛选「${d.query}」：${d.count} 张，轮播只播这些`
        : `「${d.query}」无匹配`;
    } else {
      el.className = 'cfg-result err';
      el.textContent = '筛选失败：' + (d.error || '');
    }
  } catch (e) {
    el.className = 'cfg-result err';
    el.textContent = '筛选失败（搜索服务未启动？）';
  }
}

async function clearFilter() {
  await fetch('/api/filter/clear', {method: 'POST'});
  const el = document.getElementById('filterResult');
  el.className = 'cfg-result ok';
  el.textContent = '已恢复全部照片';
  document.getElementById('filterInput').value = '';
}

document.getElementById('filterInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });

// ===== 家庭人物确认（人脸聚类只由家长赋关系称谓）=====
let identityStatus = 'unconfirmed';
let identityOffset = 0;
let identityTotal = 0;
let identityLabels = [];

function switchIdentityTab(status) {
  identityStatus = status;
  document.getElementById('identity-tab-unconfirmed').classList.toggle('active', status === 'unconfirmed');
  document.getElementById('identity-tab-confirmed').classList.toggle('active', status === 'confirmed');
  loadPersonProfiles(false);
}

async function loadPersonProfiles(append) {
  if (!append) {
    identityOffset = 0;
    document.getElementById('identity-grid').replaceChildren();
  }
  const result = document.getElementById('identity-result');
  result.className = 'cfg-result';
  result.textContent = '读取人物聚类中…';
  try {
    const r = await fetch('/api/index/person-profiles?status=' + identityStatus + '&limit=12&offset=' + identityOffset);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    identityTotal = d.total || 0;
    identityLabels = d.allowedIdentityLabels || identityLabels;
    const profiles = d.profiles || [];
    profiles.forEach(renderPersonProfile);
    identityOffset += profiles.length;
    result.textContent = identityTotal
      ? `已显示 ${identityOffset} / ${identityTotal} 个${identityStatus === 'confirmed' ? '已确认' : '待确认'}人物聚类`
      : (identityStatus === 'confirmed' ? '还没有已确认的人物' : '没有待确认的人物聚类');
    document.getElementById('identity-more').style.display = identityOffset < identityTotal ? 'block' : 'none';
  } catch (e) {
    result.className = 'cfg-result err';
    result.textContent = '人物聚类读取失败：' + e;
  }
}

function renderPersonProfile(profile) {
  const item = document.createElement('div');
  item.className = 'identity-item';
  item.dataset.subject = profile.subjectName;

  const head = document.createElement('div');
  head.className = 'identity-head';
  const subject = document.createElement('span');
  subject.textContent = profile.subjectName;
  const count = document.createElement('span');
  count.textContent = (profile.photoCount || 0) + ' 张照片';
  head.append(subject, count);

  const photos = document.createElement('div');
  photos.className = 'identity-photos';
  const samples = profile.samplePhotoIds || [];
  if (!samples.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无可预览照片';
    photos.append(empty);
  } else {
    samples.forEach((id, index) => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = '人物人脸样本';
      const faceId = (profile.sampleFaceIds || [])[index];
      img.src = faceId
        ? '/api/index/person-face?id=' + encodeURIComponent(faceId)
        : '/api/photos/file?id=' + encodeURIComponent(id);
      img.onerror = () => {
        img.remove();
        const remaining = photos.querySelectorAll('img').length;
        photos.style.gridTemplateColumns = `repeat(${Math.max(1, remaining)}, 1fr)`;
      };
      photos.append(img);
    });
  }

  const actions = document.createElement('div');
  actions.className = 'identity-actions';
  const select = document.createElement('select');
  const prompt = document.createElement('option');
  prompt.value = '';
  prompt.textContent = '选择家庭身份';
  select.append(prompt);
  identityLabels.forEach(label => {
    const option = document.createElement('option');
    option.value = label;
    option.textContent = label;
    option.selected = label === profile.identityLabel;
    select.append(option);
  });
  const save = document.createElement('button');
  save.textContent = profile.confirmed ? '修改' : '确认';
  save.onclick = () => savePersonIdentity(profile.subjectName, select.value);
  actions.append(select, save);
  if (profile.confirmed) {
    const clear = document.createElement('button');
    clear.className = 'secondary';
    clear.textContent = '撤销';
    clear.onclick = () => savePersonIdentity(profile.subjectName, null);
    actions.append(clear);
  }
  item.append(head, photos, actions);
  document.getElementById('identity-grid').append(item);
}

async function savePersonIdentity(subjectName, identityLabel) {
  const result = document.getElementById('identity-result');
  if (identityLabel === '') {
    result.className = 'cfg-result err';
    result.textContent = '请先选择家庭身份';
    return;
  }
  result.className = 'cfg-result';
  result.textContent = '保存中…';
  try {
    const r = await fetch('/api/index/person-profile', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({subjectName, identityLabel}),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
    await loadPersonProfiles(false);
    result.className = 'cfg-result ok';
    result.textContent = identityLabel ? `已将 ${subjectName} 确认为“${identityLabel}”` : `已撤销 ${subjectName} 的身份`;
  } catch (e) {
    result.className = 'cfg-result err';
    result.textContent = '保存失败：' + e;
  }
}

loadPersonProfiles(false);
</script>
</body>
</html>
