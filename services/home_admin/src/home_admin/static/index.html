<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HomeAdmin</title>
  <style>
    :root { --bg:#f4f1ea; --panel:#fffdf8; --ink:#28332f; --muted:#718078; --brand:#32745d; --danger:#b64a45; --line:#dedbd2; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#edf4ee,#f7f1e7); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    header { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:16px max(18px,calc((100% - 1100px)/2)); color:#fff; background:#244f42; box-shadow:0 2px 12px #1b3b3126; }
    header h1 { margin:0; font-size:20px; }
    main { max-width:1100px; margin:22px auto; padding:0 16px 60px; }
    .panel { margin-bottom:18px; padding:20px; background:var(--panel); border:1px solid #ffffff; border-radius:16px; box-shadow:0 8px 30px #25352f12; }
    .panel h2 { margin:0 0 14px; font-size:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
    label { display:block; color:var(--muted); font-size:13px; }
    input,select,textarea { width:100%; margin-top:5px; padding:10px 11px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); font:inherit; }
    textarea { min-height:82px; resize:vertical; }
    button { padding:10px 16px; border:0; border-radius:9px; color:#fff; background:var(--brand); font:inherit; cursor:pointer; }
    button.secondary { color:var(--ink); background:#e6ece7; }
    button.danger { background:var(--danger); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .muted { color:var(--muted); font-size:13px; }
    .error { color:var(--danger); white-space:pre-wrap; }
    .success { color:var(--brand); }
    .hidden { display:none !important; }
    .member,.device,.task,.submission,.inspection { margin-top:10px; padding:13px; border:1px solid var(--line); border-radius:11px; background:#fff; }
    .inspection { background:#f3f8f5; }
    .inspection-item { margin-top:9px; padding:10px; border-left:3px solid #8bb4a3; background:#fff; }
    .task-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .badge { padding:3px 8px; border-radius:99px; color:#315348; background:#dfede6; font-size:12px; white-space:nowrap; }
    .images { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-top:10px; }
    .images img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; background:#eee; }
    .cards { display:grid; gap:14px; }
    .provider-kind { margin-top:18px; }
    .provider-kind h3 { margin:0 0 9px; }
    .provider-card { padding:14px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .provider-card.active { border-color:#55a283; box-shadow:inset 0 0 0 1px #55a283; }
    .provider-head { display:flex; justify-content:space-between; gap:10px; }
    .provider-state { padding:3px 8px; border-radius:99px; background:#edf1ef; font-size:12px; white-space:nowrap; }
    .provider-state.healthy { color:#18794e; background:#e0f4e9; }
    .provider-state.error,.provider-state.unconfigured { color:var(--danger); background:#fae8e5; }
    .provider-state.ready { color:#956400; background:#fbf0cf; }
    .provider-summary { cursor:pointer; list-style:none; }
    .provider-summary::-webkit-details-marker { display:none; }
    .provider-fields { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
    .field-section { margin-top:13px; }
    .field-section h4 { margin:0 0 8px; }
    .provider-field { padding:10px; border:1px solid var(--line); border-radius:10px; background:#fbfcfa; }
    .credential-status { display:block; margin:7px 0; padding:8px 10px; border:1px solid #bad9ca; border-radius:8px; color:#175d43; background:#eaf6ef; font-size:13px; font-weight:700; }
    .credential-status.missing { color:var(--danger); }
    .provider-test { margin-top:14px; padding:12px; border:1px solid #c8ddd2; border-radius:10px; background:#f1f8f4; }
    .provider-test h4 { margin:0 0 8px; }
    .provider-test-result { min-height:42px; margin:9px 0 0; padding:9px; border-radius:8px; background:#fff; white-space:pre-wrap; overflow-wrap:anywhere; }
    .provider-test audio { width:100%; margin-top:9px; }
    .credential-clear { display:flex; align-items:center; gap:6px; margin-top:8px; }
    .credential-clear input { width:auto; margin:0; }
    #toast { position:fixed; right:16px; bottom:16px; max-width:360px; padding:12px 16px; border-radius:10px; color:#fff; background:#28332f; box-shadow:0 8px 28px #0003; }
    @media (max-width:600px) { .panel { padding:15px; } header { padding:14px 16px; } }
  </style>
</head>
<body>
<header>
  <h1>HomeAdmin</h1>
  <button id="logout" class="secondary hidden" type="button">退出登录</button>
</header>
<main>
  <section id="authPanel" class="panel">
    <h2>家长登录</h2>
    <form id="loginForm" class="grid">
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="actions"><button>登录</button></div>
    </form>
    <details style="margin-top:18px">
      <summary>第一次使用：初始化家庭</summary>
      <form id="bootstrapForm" class="grid" style="margin-top:12px">
        <label>家庭名称<input name="householdName" value="我的家庭" required></label>
        <label>时区<input name="timezone" value="Asia/Shanghai" required></label>
        <label>第一位家长用户名<input name="username" autocomplete="username" required></label>
        <label>密码（至少 10 位）<input name="password" type="password" minlength="10" required></label>
        <div class="actions"><button>初始化并登录</button></div>
      </form>
    </details>
    <p id="authError" class="error"></p>
  </section>

  <div id="workspace" class="hidden">
    <section class="panel">
      <div class="task-head"><div><h2>AI Provider</h2><p class="muted">ASR、TTS、LLM 的每个 Provider 分别保存凭据、模型和参数，并可单独检测。切换对下一轮调用生效。</p></div><button id="providerRefresh" class="secondary" type="button">刷新状态</button></div>
      <form id="providerSelectionForm" class="grid">
        <label>ASR Provider<select name="asr"></select></label>
        <label>TTS Provider<select name="tts"></select></label>
        <label>LLM Provider<select name="llm"></select></label>
        <div class="actions"><button>应用 Provider</button></div>
      </form>
      <div id="providerCards" class="cards"></div>
    </section>

    <section class="panel">
      <h2>家庭成员</h2>
      <p class="muted">成员姓名仅用于家庭内展示；先录入 5 岁和 10 岁两个孩子。</p>
      <form id="memberForm" class="grid">
        <label>称呼<input name="displayName" placeholder="例如：大宝" required></label>
        <label>角色<select name="role"><option value="child">孩子</option><option value="parent">家长</option><option value="elder">老人</option></select></label>
        <label>年龄<input name="age" type="number" min="0" max="120"></label>
        <div class="actions"><button>添加成员</button></div>
      </form>
      <div id="members"></div>
    </section>

    <section class="panel">
      <h2>学生平板</h2>
      <p class="muted">选择孩子生成一次性配对码。平板配对后固定为该孩子，换人前请先撤销设备。</p>
      <form id="studentPairingForm" class="grid">
        <label>绑定孩子<select name="childId" id="studentChildSelect" required></select></label>
        <div class="actions"><button>生成配对码</button></div>
      </form>
      <div id="studentPairingResult" class="hidden member"></div>
      <div id="studentDevices"></div>
    </section>

    <section class="panel">
      <h2>布置作业</h2>
      <form id="taskForm">
        <div class="grid">
          <label>孩子<select name="childId" id="childSelect" required></select></label>
          <label>标题<input name="title" placeholder="数学练习第 10 页 1—6 题" required></label>
          <label>科目<input name="subject" value="math" required></label>
          <label>日期<input name="taskDate" type="date" required></label>
          <label>截止时间<input name="dueAt" type="datetime-local"></label>
        </div>
        <label style="margin-top:12px">任务说明<textarea name="instructions" required></textarea></label>
        <div class="grid" style="margin-top:12px">
          <label>参考答案（仅家长可见）<textarea name="referenceAnswer"></textarea></label>
          <label>评分要求<textarea name="rubric"></textarea></label>
        </div>
        <div class="actions"><button>创建作业</button></div>
      </form>
    </section>

    <section class="panel">
      <div class="task-head"><h2>作业任务</h2><button id="refresh" class="secondary" type="button">刷新</button></div>
      <p id="modelStatus" class="muted">正在读取 Agent 检查配置……</p>
      <div id="tasks"></div>
    </section>
  </div>
</main>
<div id="toast" class="hidden"></div>
<script>
const api = '/api/v1';
let token = sessionStorage.getItem('homeAdminToken') || '';
let members = [];
let taskCache = [];
let providerSnapshot = null;
let modelStatus = {enabled:false,configured:false,modelName:'kimi-k3',baseUrlHost:null};
const $ = s => document.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const statusText = {pending:'待开始',in_progress:'进行中',needs_parent_review:'待家长审核',completed:'已完成',cancelled:'已取消'};
const inspectionStatusText = {running:'检查中',completed:'检查完成',needs_parent_review:'需要家长重点复核',failed:'检查失败'};

function toast(message, error=false) {
  const box = $('#toast'); box.textContent = message; box.style.background = error ? '#9b413d' : '#28332f'; box.classList.remove('hidden');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => box.classList.add('hidden'), 3500);
}

async function request(path, options={}) {
  const headers = new Headers(options.headers || {});
  if (token) headers.set('Authorization', 'Bearer ' + token);
  if (options.body && !(options.body instanceof FormData)) headers.set('Content-Type', 'application/json');
  const response = await fetch(api + path, {...options, headers, cache:'no-store'});
  if (response.status === 204) return null;
  const type = response.headers.get('content-type') || '';
  const data = type.includes('json') ? await response.json() : await response.text();
  if (!response.ok) {
    if (response.status === 401 && token) { token=''; sessionStorage.removeItem('homeAdminToken'); showAuth(); }
    throw new Error(data.message || data.detail || `请求失败 (${response.status})`);
  }
  return data;
}

function formJson(form) {
  const result = Object.fromEntries(new FormData(form).entries());
  for (const key of Object.keys(result)) if (result[key] === '') delete result[key];
  return result;
}

function showAuth() { $('#authPanel').classList.remove('hidden'); $('#workspace').classList.add('hidden'); $('#logout').classList.add('hidden'); }
function showWorkspace() { $('#authPanel').classList.add('hidden'); $('#workspace').classList.remove('hidden'); $('#logout').classList.remove('hidden'); }

async function login(username, password) {
  const data = await request('/auth/login', {method:'POST', body:JSON.stringify({username,password})});
  token = data.token; sessionStorage.setItem('homeAdminToken', token); showWorkspace(); await loadAll();
}

$('#loginForm').addEventListener('submit', async event => {
  event.preventDefault(); const data=formJson(event.target); $('#authError').textContent='';
  try { await login(data.username, data.password); } catch (e) { $('#authError').textContent=e.message; }
});

$('#bootstrapForm').addEventListener('submit', async event => {
  event.preventDefault(); const data=formJson(event.target); $('#authError').textContent='';
  try { await request('/bootstrap',{method:'POST',body:JSON.stringify(data)}); await login(data.username,data.password); }
  catch(e) { $('#authError').textContent=e.message; }
});

$('#logout').addEventListener('click', async () => { try { await request('/auth/logout',{method:'POST'}); } catch (_) {} token=''; sessionStorage.removeItem('homeAdminToken'); showAuth(); });

const providerKindLabel={asr:'语音识别 ASR',tts:'语音合成 TTS',llm:'大语言模型 LLM'};
const providerSectionLabel={credential:'连接凭据',model:'模型与语言',voice:'音色与角色',parameter:'生成参数',advanced:'高级连接参数'};

function providerField(kind,item,field,index) {
  const id=`provider-${kind}-${item.name}-${field.name}-${index}`;
  const required=field.required && !(field.secret && field.configured)?'required':'';
  const help=field.help?`<span class="muted">${esc(field.help)}</span>`:'';
  const source=field.source==='managed'?'后台保存':field.source==='environment'?'环境变量':'未设置';
  const configured=field.secret?`<span class="credential-status ${field.configured?'':'missing'}">${field.configured?`已配置 ${esc(field.hint||'已脱敏')} · ${source}`:'尚未配置'}</span>`:'';
  let control='';
  if(field.type==='boolean') {
    control=`<input id="${esc(id)}" data-provider-field="${esc(field.name)}" data-field-type="boolean" type="checkbox" ${field.value?'checked':''}>`;
  } else if(field.type==='select' && !field.allowCustom) {
    control=`<select id="${esc(id)}" data-provider-field="${esc(field.name)}" data-field-type="${esc(field.type)}" ${required}>${(field.options||[]).map(option=>`<option value="${esc(option.value)}" ${String(option.value)===String(field.value)?'selected':''}>${esc(option.label)}</option>`).join('')}</select>`;
  } else {
    const type=field.secret && !field.configured?'password':field.type==='number'?'number':'text';
    const list=(field.options||[]).length?`${id}-choices`:'';
    const value=field.secret?(field.configured?field.hint||'已脱敏':''):field.value??'';
    const placeholder=field.secret?(field.configured?'输入新值可替换；留空保留现有值':'请输入凭据'):'';
    const bounds=field.type==='number'?`${field.min!=null?`min="${esc(field.min)}"`:''} ${field.max!=null?`max="${esc(field.max)}"`:''} step="any"`:'';
    const secretHint=field.secret && field.configured?`data-secret-hint="${esc(field.hint||'已脱敏')}"`:'';
    control=`<input id="${esc(id)}" data-provider-field="${esc(field.name)}" data-field-type="${esc(field.type)}" ${secretHint} type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${list?`list="${esc(list)}"`:''} ${bounds} ${required} autocomplete="${field.secret?'new-password':'off'}">${list?`<datalist id="${esc(list)}">${field.options.map(option=>`<option value="${esc(option.value)}">${esc(option.label)}</option>`).join('')}</datalist>`:''}`;
  }
  const clear=field.secret?`<span class="credential-clear"><input type="checkbox" data-clear-field="${esc(field.name)}">清除此 Provider 的现有值</span>`:'';
  return `<label class="provider-field" for="${esc(id)}">${esc(field.label)}${field.required?' *':''}${configured}${control}${help}${clear}</label>`;
}

function providerTestPanel(kind,item) {
  const disabled=item.configured?'':'disabled';
  if(kind==='asr') return `<section class="provider-test" data-provider-test data-kind="${kind}" data-provider="${esc(item.name)}"><h4>实际语音识别测试</h4><p class="muted">点击录音并说出测试内容，再次点击停止；系统会显示真实识别结果。</p><div class="actions"><button type="button" data-asr-record ${disabled}>开始录音</button></div><div class="provider-test-result" data-test-result>尚未测试</div></section>`;
  const label=kind==='tts'?'要合成并播放的文字':'要发送给模型的问题';
  const value=kind==='tts'?'小方语音服务测试。':'请用一句话介绍你自己。';
  return `<section class="provider-test" data-provider-test data-kind="${kind}" data-provider="${esc(item.name)}"><h4>${kind==='tts'?'实际语音合成测试':'实际模型对话测试'}</h4><label>${label}<textarea data-test-input>${esc(value)}</textarea></label><div class="actions"><button type="button" data-provider-test-run ${disabled}>执行测试</button></div>${kind==='tts'?'<audio controls class="hidden" data-test-audio></audio>':''}<div class="provider-test-result" data-test-result>尚未测试</div></section>`;
}

function providerCard(kind, item) {
  const checked=item.lastCheckedAt?new Date(item.lastCheckedAt).toLocaleString():'尚未检测';
  const state={healthy:'正常',error:'异常',ready:'待检测',unconfigured:'未配置'}[item.state]||item.state;
  const fields=item.fields||[];
  const sections=Object.keys(providerSectionLabel).filter(section=>fields.some(field=>field.section===section)).map(section=>`<div class="field-section"><h4>${providerSectionLabel[section]}</h4><div class="grid">${fields.filter(field=>field.section===section).map((field,index)=>providerField(kind,item,field,index)).join('')}</div></div>`).join('');
  const detail=[`模型 ${item.model}`,item.voice?`角色 ${item.voice}`:'',item.language?`语言 ${item.language}`:'',item.streaming?'流式接口':''].filter(Boolean).join(' · ');
  return `<details class="provider-card ${item.active?'active':''}" ${item.active?'open':''}><summary class="provider-summary"><div class="provider-head"><b>${esc(item.label)}</b><span class="provider-state ${esc(item.state)}">${esc(state)}</span></div><p class="muted">${esc(detail)}<br>${item.active?'当前启用 · ':''}${item.configured?'配置完整':'缺少凭据或本地模型'} · ${esc(checked)}${item.latencyMs!=null?` · ${item.latencyMs} ms`:''}${item.message?`<br>${esc(item.message)}`:''}</p></summary><form class="provider-fields" data-provider-config data-kind="${esc(kind)}" data-provider="${esc(item.name)}">${sections}<div class="actions"><button type="submit">保存此 Provider</button></div>${providerTestPanel(kind,item)}</form></details>`;
}

function renderProviders(data) {
  providerSnapshot=data;
  for(const kind of ['asr','tts','llm']) {
    const select=$(`#providerSelectionForm [name=${kind}]`);
    select.innerHTML=data.providers[kind].map(item=>`<option value="${esc(item.name)}">${esc(item.label)}</option>`).join('');
    select.value=data.selection[kind];
  }
  $('#providerCards').innerHTML=['asr','tts','llm'].map(kind=>`<section class="provider-kind"><h3>${providerKindLabel[kind]}</h3>${data.providers[kind].map(item=>providerCard(kind,item)).join('')}</section>`).join('');
  document.querySelectorAll('[data-provider-config]').forEach(form=>form.addEventListener('submit',saveProviderConfiguration));
  document.querySelectorAll('[data-provider-test-run]').forEach(button=>button.addEventListener('click',runTextProviderTest));
  document.querySelectorAll('[data-asr-record]').forEach(button=>button.addEventListener('click',toggleAsrRecording));
  document.querySelectorAll('[data-clear-field]').forEach(input=>input.addEventListener('change',event=>{
    const field=event.currentTarget.closest('.provider-field').querySelector('[data-provider-field]'); field.disabled=event.currentTarget.checked;
  }));
  document.querySelectorAll('[data-secret-hint]').forEach(input=>{
    input.addEventListener('focus',()=>{ if(input.value===input.dataset.secretHint){ input.value=''; input.type='password'; } });
    input.addEventListener('blur',()=>{ if(!input.value){ input.value=input.dataset.secretHint; input.type='text'; } });
  });
}

async function loadProviders() { renderProviders(await request('/admin/providers')); }

async function checkProvider(event) {
  const button=event.currentTarget; const [kind,name]=button.dataset.providerCheck.split(':'); button.disabled=true;
  try { renderProviders(await request('/admin/providers/check',{method:'POST',body:JSON.stringify({kind,name})})); toast('Provider 检测完成'); }
  catch(e) { toast(e.message,true); await loadProviders().catch(()=>{}); }
  finally { button.disabled=false; }
}

let activeAsrRecording=null;

function pcmBase64(chunks,inputRate) {
  const total=chunks.reduce((sum,chunk)=>sum+chunk.length,0); const merged=new Float32Array(total); let offset=0;
  for(const chunk of chunks){merged.set(chunk,offset);offset+=chunk.length;}
  const ratio=inputRate/16000; const output=new Int16Array(Math.floor(merged.length/ratio));
  for(let i=0;i<output.length;i++){const sample=Math.max(-1,Math.min(1,merged[Math.floor(i*ratio)]||0));output[i]=sample<0?sample*32768:sample*32767;}
  const bytes=new Uint8Array(output.buffer); let binary='';
  for(let i=0;i<bytes.length;i+=32768) binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
  return btoa(binary);
}

async function executeProviderTest(panel,body) {
  const result=panel.querySelector('[data-test-result]'); result.textContent='测试中…';
  try {
    const data=await request('/admin/providers/test',{method:'POST',body:JSON.stringify({kind:panel.dataset.kind,name:panel.dataset.provider,...body})});
    if(data.audioBase64){const audio=panel.querySelector('[data-test-audio]');audio.src=`data:${data.audioMimeType||'audio/wav'};base64,${data.audioBase64}`;audio.classList.remove('hidden');await audio.play().catch(()=>{});result.textContent=`语音已生成，可用上方播放器重播（${data.latencyMs} ms）`;}
    else result.textContent=(data.text&&data.text.trim())?`${data.text}\n\n耗时：${data.latencyMs} ms`:`未识别到文字\n\n耗时：${data.latencyMs} ms`;
  } catch(e) { result.textContent=`测试失败：${e.message}`; }
}

function runTextProviderTest(event) {
  const panel=event.currentTarget.closest('[data-provider-test]'); const text=panel.querySelector('[data-test-input]').value.trim();
  if(!text){toast('请先输入测试内容',true);return;} executeProviderTest(panel,{text});
}

async function toggleAsrRecording(event) {
  const button=event.currentTarget; const panel=button.closest('[data-provider-test]');
  if(activeAsrRecording){
    if(activeAsrRecording.panel!==panel){toast('请先结束另一个录音测试',true);return;}
    const recording=activeAsrRecording; activeAsrRecording=null; clearTimeout(recording.timer); recording.processor.disconnect(); recording.source.disconnect(); recording.stream.getTracks().forEach(track=>track.stop()); await recording.context.close(); button.textContent='开始录音'; button.disabled=true;
    try { await executeProviderTest(panel,{audioBase64:pcmBase64(recording.chunks,recording.sampleRate)}); } finally { button.disabled=false; }
    return;
  }
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}}); const context=new AudioContext(); const source=context.createMediaStreamSource(stream); const processor=context.createScriptProcessor(4096,1,1); const chunks=[];
    processor.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); source.connect(processor); processor.connect(context.destination); button.textContent='停止并识别'; panel.querySelector('[data-test-result]').textContent='录音中，请说出测试内容…';
    activeAsrRecording={panel,button,stream,context,source,processor,chunks,sampleRate:context.sampleRate,timer:setTimeout(()=>button.click(),8000)};
  } catch(e) { panel.querySelector('[data-test-result]').textContent=`无法录音：${e.message}`; }
}

$('#providerSelectionForm').addEventListener('submit', async event => {
  event.preventDefault(); const body=Object.fromEntries(new FormData(event.currentTarget));
  try { renderProviders(await request('/admin/providers/selection',{method:'PUT',body:JSON.stringify(body)})); toast('Provider 已切换'); }
  catch(e) { toast(e.message,true); }
});

async function saveProviderConfiguration(event) {
  event.preventDefault(); const form=event.currentTarget; const values={};
  for(const field of form.querySelectorAll('[data-provider-field]')) {
    if(field.disabled) continue;
    const type=field.dataset.fieldType; const raw=type==='boolean'?'':String(field.value).trim();
    if(type!=='boolean' && !raw) continue;
    if(type==='secret' && field.dataset.secretHint && raw===field.dataset.secretHint) continue;
    let value=type==='boolean'?field.checked:raw;
    if(type==='secret' && !value) continue;
    if(type==='number') value=Number(value);
    if(value!=='' && !(type==='number' && Number.isNaN(value))) values[field.dataset.providerField]=value;
  }
  const clear=[...form.querySelectorAll('[data-clear-field]:checked')].map(input=>input.dataset.clearField);
  try {
    renderProviders(await request(`/admin/providers/${encodeURIComponent(form.dataset.kind)}/${encodeURIComponent(form.dataset.provider)}/configuration`,{method:'PUT',body:JSON.stringify({values,clear})}));
    toast('Provider 配置已保存');
  } catch(e) { toast(e.message,true); }
}

$('#providerRefresh').addEventListener('click',()=>loadProviders().catch(e=>toast(e.message,true)));

async function loadMembers() {
  members = await request('/homework/members');
  $('#members').innerHTML = members.length ? members.map(m => `<div class="member"><b>${esc(m.displayName)}</b>　<span class="badge">${esc(m.role)}</span>　<span class="muted">${m.age == null ? '年龄未填' : esc(m.age)+' 岁'}${m.active?'':' · 已停用'}</span></div>`).join('') : '<p class="muted">还没有成员。</p>';
  const children = members.filter(m => m.role === 'child' && m.active);
  const options = children.map(m => `<option value="${esc(m.id)}">${esc(m.displayName)}${m.age == null?'':'（'+esc(m.age)+'岁）'}</option>`).join('');
  $('#childSelect').innerHTML = options;
  $('#studentChildSelect').innerHTML = options;
}

$('#memberForm').addEventListener('submit', async event => {
  event.preventDefault(); const data=formJson(event.target); if (data.age !== undefined) data.age=Number(data.age);
  try { await request('/homework/members',{method:'POST',body:JSON.stringify(data)}); event.target.reset(); await loadMembers(); toast('成员已添加'); }
  catch(e) { toast(e.message,true); }
});

async function loadStudentDevices() {
  const devices = await request('/homework/student-devices');
  $('#studentDevices').innerHTML = devices.length ? devices.map(device => `<div class="device"><b>${esc(device.name)}</b>　<span class="badge">${esc(device.childName)}</span><div class="muted">${esc(device.platform)} · ${device.active ? '已启用' : '已撤销'}${device.lastSeenAt ? ' · 最近连接 '+esc(new Date(device.lastSeenAt).toLocaleString()) : ''}</div>${device.active ? `<div class="actions"><button class="danger" onclick="revokeStudentDevice('${device.id}')">撤销设备</button></div>` : ''}</div>`).join('') : '<p class="muted">还没有配对学生平板。</p>';
}

$('#studentPairingForm').addEventListener('submit', async event => {
  event.preventDefault(); const data=formJson(event.target);
  try {
    const result=await request('/homework/student-pairing-codes',{method:'POST',body:JSON.stringify(data)});
    const box=$('#studentPairingResult');
    box.innerHTML=`<b>${esc(result.childName)}的配对码</b><p style="font-size:24px;letter-spacing:1px;word-break:break-all">${esc(result.code)}</p><p class="muted">有效期至 ${esc(new Date(result.expiresAt).toLocaleString())}，只能使用一次。请不要截图长期保存。</p>`;
    box.classList.remove('hidden'); toast('配对码已生成');
  } catch(e) { toast(e.message,true); }
});

async function revokeStudentDevice(id) {
  if(!confirm('撤销后，这台平板需要重新配对才能使用。确定撤销吗？'))return;
  try { await request(`/homework/student-devices/${id}/revoke`,{method:'POST'}); await loadStudentDevices(); toast('学生设备已撤销'); }
  catch(e) { toast(e.message,true); }
}

$('#taskForm [name=taskDate]').value = new Date().toLocaleDateString('en-CA');
$('#taskForm').addEventListener('submit', async event => {
  event.preventDefault(); const data=formJson(event.target);
  if (data.dueAt) data.dueAt = new Date(data.dueAt).toISOString();
  try { await request('/homework/tasks',{method:'POST',body:JSON.stringify(data)}); event.target.reset(); $('#taskForm [name=taskDate]').value=new Date().toLocaleDateString('en-CA'); await loadTasks(); toast('作业已创建'); }
  catch(e) { toast(e.message,true); }
});

async function loadTasks() {
  const tasks = await request('/homework/tasks'); taskCache = tasks;
  const target = $('#tasks');
  target.innerHTML = tasks.length ? tasks.map(taskCard).join('') : '<p class="muted">还没有作业。</p>';
}

async function loadModelStatus() {
  modelStatus = await request('/homework/model-status');
  const text = modelStatus.configured
    ? `Agent 图片检查已就绪：${modelStatus.modelName}（${modelStatus.baseUrlHost}）。每次检查都需要家长明确确认后才会发送图片。`
    : modelStatus.enabled
      ? 'Agent 图片检查已启用，但模型地址、模型名或 API Key 尚未配置完整。'
      : 'Agent 图片检查默认关闭；配置服务器环境变量并启用后，家长可逐次授权发送作业图片。';
  $('#modelStatus').textContent = text;
}

function taskCard(t) {
  const child = members.find(m => m.id===t.childId);
  const canSubmit = ['pending','in_progress'].includes(t.status);
  return `<article class="task" data-task="${esc(t.id)}">
    <div class="task-head"><div><b>${esc(t.title)}</b><div class="muted">${esc(child?.displayName||'未知孩子')} · ${esc(t.taskDate)} · ${esc(t.subject)}</div></div><span class="badge">${esc(statusText[t.status]||t.status)}</span></div>
    <p>${esc(t.instructions)}</p>${t.referenceAnswer?`<details><summary>参考答案（家长）</summary><p>${esc(t.referenceAnswer)}</p></details>`:''}
    <div class="actions">
      ${t.status==='pending'?`<button onclick="taskAction('${t.id}','start')">开始</button>`:''}
      ${canSubmit?`<button class="secondary" onclick="editTask('${t.id}')">修改</button>`:''}
      ${canSubmit?`<button class="secondary" onclick="chooseFiles('${t.id}')">上传作业照片</button><input class="hidden" id="files-${t.id}" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadFiles('${t.id}',this)">`:''}
      ${!['completed','cancelled'].includes(t.status)?`<button class="danger" onclick="taskAction('${t.id}','cancel')">取消</button>`:''}
      <button class="secondary" onclick="loadSubmissions('${t.id}')">查看提交</button>
    </div><div id="submissions-${t.id}"></div></article>`;
}

async function taskAction(id, action) { try { await request(`/homework/tasks/${id}/${action}`,{method:'POST'}); await loadTasks(); toast('状态已更新'); } catch(e) { toast(e.message,true); } }
async function editTask(id) {
  const oldTitle=taskCache.find(task=>task.id===id)?.title||'';
  const title=prompt('修改作业标题',oldTitle); if(title===null||!title.trim())return;
  try { await request(`/homework/tasks/${id}`,{method:'PATCH',body:JSON.stringify({title:title.trim()})}); await loadTasks(); toast('作业已修改'); }
  catch(e) { toast(e.message,true); }
}
function chooseFiles(id) { document.getElementById('files-'+id).click(); }
async function uploadFiles(id, input) {
  const files=[...input.files]; if (!files.length) return; if(files.length>6){toast('每次最多 6 张',true);return;}
  const body=new FormData(); files.forEach(file=>body.append('files',file));
  try { await request(`/homework/tasks/${id}/submissions`,{method:'POST',body}); await loadTasks(); toast('照片已保存，等待家长审核'); }
  catch(e) { toast(e.message,true); } finally { input.value=''; }
}

async function protectedImage(img, url) {
  const response=await fetch(url,{headers:{Authorization:'Bearer '+token}}); if(!response.ok)return;
  img.src=URL.createObjectURL(await response.blob());
}

async function loadSubmissions(taskId) {
  try {
    const submissions=await request(`/homework/tasks/${taskId}/submissions`);
    await Promise.all(submissions.map(async submission => {
      submission.inspections=await request(`/homework/submissions/${submission.id}/inspections`);
    }));
    const box=document.getElementById('submissions-'+taskId);
    box.innerHTML=submissions.length?submissions.map(s=>`<div class="submission"><b>第 ${s.attemptNo} 次提交</b>　<span class="badge">${esc(s.status)}</span>
      <div class="images">${s.assets.map(a=>`<img data-protected="${esc(a.url)}" alt="作业图片">`).join('')}</div>
      ${s.status==='needs_parent_review'&&modelStatus.configured?`<div class="actions"><button class="secondary" onclick="inspectSubmission('${s.id}','${taskId}',this)">授权 Agent 检查这些图片</button></div><p class="muted">点击后，本次提交的图片、作业要求、参考答案和评分标准会发送给 ${esc(modelStatus.modelName)}；结果仅供家长复核。</p>`:''}
      ${s.inspections.map(inspectionCard).join('')}
      ${s.status==='needs_parent_review'?`<form onsubmit="review(event,'${s.id}')"><label>审核意见<textarea name="summary" required placeholder="完成质量、需要改进的部分"></textarea></label><label>完成质量<select name="qualityLevel"><option value="excellent">优秀</option><option value="good">良好</option><option value="needs_revision">需要修改</option><option value="unknown">无法判断</option></select></label><div class="actions"><button name="decision" value="accept">确认完成</button><button class="danger" name="decision" value="retry">要求重做</button></div></form>`:''}
      ${s.reviews.map(r=>`<p><b>审核：</b>${esc(r.summary)}（${esc(r.qualityLevel)}）</p>`).join('')}</div>`).join(''):'<p class="muted">暂无提交。</p>';
    box.querySelectorAll('img[data-protected]').forEach(img=>protectedImage(img,img.dataset.protected));
  } catch(e) { toast(e.message,true); }
}

function inspectionCard(result) {
  const confidence=result.confidence==null?'—':Math.round(result.confidence*100)+'%';
  const items=(result.items||[]).map(item=>`<div class="inspection-item"><b>${esc(item.location)}</b><p>${esc(item.issue)}</p><p><b>提示：</b>${esc(item.hint)}</p><p><b>类似例子：</b>${esc(item.similarExample)}</p><ol>${item.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol><span class="muted">该项置信度 ${Math.round(item.confidence*100)}%</span></div>`).join('');
  if(result.status==='failed') return `<div class="inspection"><b>Agent 检查失败</b><p class="error">错误代码：${esc(result.errorCode||'model_provider_error')}</p><p class="muted">图片仍保存在本机，作业状态未改变；可稍后重试或直接人工审核。</p></div>`;
  return `<div class="inspection"><div class="task-head"><b>Agent 检查建议</b><span class="badge">${esc(inspectionStatusText[result.status]||result.status)}</span></div><p>${esc(result.summary||'正在检查……')}</p><p class="muted">模型 ${esc(result.modelName)} · 图片质量 ${esc(result.imageQuality||'—')} · 总置信度 ${esc(confidence)} · 建议 ${esc(result.suggestedDecision||'—')}</p>${items||'<p class="muted">未指出明确问题，仍需家长查看原图后决定。</p>'}<p class="muted">Agent 建议不会自动确认完成，也不会向孩子显示完整答案。</p></div>`;
}

async function inspectSubmission(submissionId, taskId, button) {
  if(!confirm(`本次会把作业图片、作业要求、参考答案和评分标准发送给 ${modelStatus.modelName} 进行检查。是否授权这一次发送？`))return;
  button.disabled=true; button.textContent='Agent 检查中……';
  try { const result=await request(`/homework/submissions/${submissionId}/inspect`,{method:'POST'}); await loadSubmissions(taskId); toast(result.status==='failed'?'Agent 检查失败，可稍后重试':'Agent 检查建议已返回',result.status==='failed'); }
  catch(e) { button.disabled=false; button.textContent='授权 Agent 检查这些图片'; toast(e.message,true); }
}

async function review(event, submissionId) {
  event.preventDefault(); const data=formJson(event.target); data.decision=event.submitter.value; data.items=[];
  try { await request(`/homework/submissions/${submissionId}/review`,{method:'POST',body:JSON.stringify(data)}); await loadTasks(); toast(data.decision==='accept'?'已确认完成':'已要求重做'); }
  catch(e) { toast(e.message,true); }
}

async function loadAll() { await Promise.all([loadProviders(),loadMembers()]); await Promise.all([loadStudentDevices(),loadModelStatus(),loadTasks()]); }
$('#refresh').addEventListener('click', loadAll);
(async()=>{ if(!token){showAuth();return;} try{showWorkspace();await loadAll();}catch(e){toast(e.message,true);} })();
</script>
