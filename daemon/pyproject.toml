[project]
name = "smart-frame-photo-daemon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "insightface>=1.0.1",
    "numpy>=2.5.1",
    "onnxruntime>=1.27.0",
    "pillow>=12.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "webdavclient3>=3.14.7",
]

[[tool.uv.index]]
name = "pytorch-cu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu" }]
torchvision = [{ index = "pytorch-cu" }]
